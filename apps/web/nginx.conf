server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # El navegador solo habla con este origen: /api/* (y /api/docs) se reenvía a la API. Así no hace falta CORS.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # $remote_addr (y no $proxy_add_x_forwarded_for) SOBRESCRIBE cualquier X-Forwarded-For que mande el cliente:
    # con TRUST_PROXY=1 la API ve una sola IP, la real, y nadie puede falsearla para esquivar el límite.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }

  # Los archivos de /assets llevan hash en el nombre: nunca cambian, se pueden cachear un año.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/security-headers.inc;
    try_files $uri =404;
  }

  # Todo lo demás es la aplicación de una sola página: rutas como /fuentes las resuelve React en el navegador.
  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.inc;
    try_files $uri /index.html;
  }
}
